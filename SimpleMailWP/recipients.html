<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessagingHub - Recipients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    </style>
</head>

<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="hover:bg-gray-100 text-gray-700 px-3 py-2 rounded-lg transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back
                    </a>
                    <div class="flex items-center">
                        <i class="fas fa-paper-plane text-2xl mr-3 text-blue-600"></i>
                        <h1 class="text-xl font-bold text-gray-900">MessagingHub</h1>
                    </div>
                </div>
                <button id="logoutBtn"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition">
                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">Recipients Management</h2>
                    <p class="text-gray-600 mt-1">Manage your contact list</p>
                </div>
                <!-- <button onclick="openAddModal()"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 shadow-lg transition">
                    <i class="fas fa-plus mr-2"></i>Add Recipient
                </button> -->
            </div>

            <div class="mb-6 flex flex-wrap gap-4">
                <div class="flex-1 min-w-64">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchInput"
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            placeholder="Search recipients...">
                    </div>
                </div>
                <select id="filterStatus"
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
                    <option value="all">All Status</option>
                    <option value="Queued">Queued</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <div class="overflow-x-auto">
                <div class="max-h-[500px] overflow-y-auto border border-gray-200 rounded-lg">
                    <table class="w-full min-w-max border-collapse">
                        <thead class="bg-gray-50 sticky top-0 z-10">
                            <tr>
                                
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:text-gray-700"
                                    onclick="sortTable('name')">
                                    Name <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:text-gray-700"
                                    onclick="sortTable('email')">
                                    Email <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:text-gray-700"
                                    onclick="sortTable('phone')">
                                    Phone <i class="fas fa-sort ml-1"></i>
                                </th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Status
                                </th>
                                
                            </tr>
                        </thead>
                        <tbody id="recipientsTable" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>


            <div class="mt-6 flex justify-between items-center">
                <p class="text-sm text-gray-600">
                    Showing <span id="showingCount">0</span> of <span id="totalCount">0</span> recipients
                </p>
                <!-- <div class="flex space-x-2">
                    <button
                        class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition disabled:opacity-50"
                        disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg">1</button>
                    <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">2</button>
                    <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">3</button>
                    <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div> -->
            </div>
        </div>
    </div>

    

    <script type="module" src="js/recipients.js"></script>
</body>

</html>
