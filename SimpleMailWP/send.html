<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MessagingHub - Send Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        /* Loader fade animation */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        .fade-out {
            animation: fadeOut 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- 🌟 Fullscreen Loader Overlay -->
    <div id="tableLoader"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-100/80 backdrop-blur-sm">
        <div class="flex flex-col items-center space-y-3">
            <div class="w-12 h-12 border-4 border-purple-500 border-t-transparent rounded-full animate-spin shadow-md">
            </div>
            <p class="text-gray-700 font-medium">Loading recipients...</p>
        </div>
    </div>

    <!-- 🧭 Navbar -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="hover:bg-gray-100 text-gray-700 px-3 py-2 rounded-lg transition">
                        <i class="fas fa-arrow-left mr-2"></i>Back
                    </a>
                    <div class="flex items-center">
                        <i class="fas fa-paper-plane text-2xl mr-3 text-blue-600"></i>
                        <h1 class="text-xl font-bold text-gray-900">MessagingHub</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="channelBadge"
                        class="px-4 py-2 text-blue-700 rounded-lg text-sm font-medium" ></span>
                    <button id="logoutBtn"
                        class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 🧱 Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-3 gap-6">
            <!-- Left: Message Form & Recipients -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-lg shadow border border-gray-200 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-900">
                            <i id="channelIcon" class="mr-2"></i>
                            <span id="channelTitle"></span>
                        </h2>
                        <button onclick="window.location.href='recipients.html'"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                            <i class="fas fa-table mr-2"></i>View Recipients
                        </button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Message Subject / Title</label>
                            <input type="text" id="messageSubject"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                placeholder="Enter message subject" readonly>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Message Content</label>
                            <textarea id="messageContent" rows="6"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none"
                                placeholder="Type your message here..." readonly></textarea>
                            <p class="text-sm text-gray-500 mt-1">
                                <span id="charCount">0</span> characters
                            </p>
                        </div>

                        <!-- Table with Loader Wrapper -->
                        <div class="relative">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Select Recipients (Click row to use template)
                            </label>

                            <div class="border border-gray-300 rounded-lg overflow-hidden">
                                <div class="overflow-x-auto max-h-96 overflow-y-auto">
                                    <table class="w-full text-sm">
                                        <thead class="bg-gray-50 sticky top-0">
                                            <tr>
                                                <th
                                                    class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                                    <input type="checkbox" id="selectAllRecipients"
                                                        class="w-4 h-4 text-blue-600 rounded">
                                                </th>
                                                <th
                                                    class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                                    Name</th>
                                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase"
                                                    id="contactHeader">Email</th>
                                                <th
                                                    class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                                    Company</th>
                                                <th
                                                    class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                                    HR Name</th>
                                                <th
                                                    class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                                    Template</th>
                                                <th
                                                    class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">
                                                    Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="recipientsTableBody" class="bg-white divide-y divide-gray-200">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mt-2">
                                <i class="fas fa-info-circle mr-1"></i>
                                Click on a row to load its template into the message fields above.
                            </p>
                        </div>

                        <div class="flex space-x-4">
                            <button id="sendBtn"
                                class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-lg">
                                <i class="fas fa-paper-plane mr-2"></i>Send Messages
                            </button>
                            <button onclick="window.location.href='settings.html'"
                                class="px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition">
                                <i class="fas fa-cog mr-2"></i>Settings
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Logs -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-lg p-6 sticky top-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold text-gray-900">
                            <i class="fas fa-stream mr-2 text-blue-600"></i>Sending Logs
                        </h3>
                        <button id="downloadLogsBtn"
                            class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                            <i class="fas fa-download mr-1"></i>Download
                        </button>
                    </div>
                    <div id="logsContainer" class="space-y-2 max-h-96 overflow-y-auto">
                        <div class="text-center text-gray-400 py-8">
                            <i class="fas fa-info-circle text-4xl mb-2"></i>
                            <p class="text-sm">No activity yet</p>
                            <p class="text-xs">Logs will appear here when sending</p>
                        </div>
                    </div>
                    <div id="progressSection" class="mt-4 hidden">
                        <div class="flex justify-between text-sm mb-2">
                            <span class="text-gray-600">Progress</span>
                            <span id="progressText" class="font-semibold">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300"
                                style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <!-- <script type="module">
        import { CONFIG } from './js/config.js';
    </script> -->

    <script type="module" src="js/send.js"></script>
    <script type="module">
        import { CONFIG } from './js/config.js';
        window.add_Log = function(message, type = 'info') {
            const container = document.getElementById('logsContainer');
            const timestamp = new Date().toLocaleTimeString();

            if (container.querySelector('.text-center')) {
                container.innerHTML = '';
            }

            const iconMap = {
                info: 'fa-info-circle text-blue-500',
                success: 'fa-check-circle text-green-500',
                error: 'fa-exclamation-circle text-red-500',
                warning: 'fa-exclamation-triangle text-yellow-500'
            };

            const logEntry = document.createElement('div');
            logEntry.className = 'p-3 bg-gray-50 rounded-lg slide-in';
            logEntry.innerHTML = `
                <div class="flex items-start">
                    <i class="fas ${iconMap[type]} mt-1 mr-2"></i>
                    <div class="flex-1">
                        <p class="text-sm text-gray-800">${message}</p>
                        <p class="text-xs text-gray-500 mt-1">${timestamp}</p>
                    </div>
                </div>
            `;

            container.insertBefore(logEntry, container.firstChild);

            if (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        window.update_Progress = function(current, total) {
            const percentage = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent = percentage + '%';
            document.getElementById('progressSection').classList.remove('hidden');
        }

        window.update_server_status = function(id, email_status = null, wp_status = null) {
            // send a post request to the server to update the status
            const token = localStorage.getItem('token');
            fetch(`${CONFIG.API_URL}/api/win-update-status`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ record_id: id, email_status: email_status, wp_status: wp_status })
            }).then(response => {
                if (!response.ok) {
                    console.error('status update failed');
                }
            }).catch(error => {
                console.error('Error:', error);
            }); 
        }
    </script>
</body>

</html>
